name: CI (Ant build + JUnit)

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build
        run: ant build

      - name: Run unit tests (testall)
        run: ant testall